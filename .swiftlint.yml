# SwiftLint config for Design System
# Relaxed rules for token names (sm, md, xs), math (x, y, a, r, g, b), and showcase length.

disabled_rules:
  - switch_case_alignment          # often ugly with long case blocks
  - multiple_closures_with_trailing_closure  # SwiftUI style
  - large_tuple                   # common in view builders

opt_in_rules: []

# Lenient so showcase/long files don't produce warnings; still catches extreme cases
line_length:
  warning: 550
  error: 600
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 1100
  error: 1500

identifier_name:
  min_length: 1
  max_length: 60
  allowed_symbols: "_"

type_name:
  allowed_symbols: "_"

# Don't fail on force_cast in one-off layout code; prefer fixing when possible
force_cast: warning
force_try: warning

# Paths to include
included:
  - Sources
  - Package.swift

excluded:
  - XcodeSnippets
  - .build
